name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag since v8 — pinning the
      # exact version is what upstream requires, not a style choice.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - run: uv sync

      - name: tests (no keys)
        env:
          SERPAPI_API_KEY: ""
          GOOGLE_MAPS_API_KEY: ""
        run: uv run pytest

      - name: tests (keys set)
        env:
          SERPAPI_API_KEY: fake-ci-key
          GOOGLE_MAPS_API_KEY: fake-ci-key
        run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.11

      - run: uv sync

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1

  # A GitHub Release is an announcement, so it waits on `publish`: a release
  # page for a version that never reached PyPI would send people to an install
  # command that fails.
  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag name reaches the shell through the environment rather than
      # `${{ }}` interpolation. Interpolating it would splice whatever the tag
      # is named straight into the command line.
      - name: Build the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "$TAG" > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
