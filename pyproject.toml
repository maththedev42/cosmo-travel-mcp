[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmo-travel-mcp"
version = "1.2.0"
description = "MCP server for planning a whole trip: flights, hotels, events, things to do, driving costs, itinerary checking and calendar export"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Matheus Weber"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "travel",
    "trip-planning",
    "itinerary",
    "flights",
    "hotels",
    "accommodations",
    "events",
    "things-to-do",
    "calendar",
    "serpapi",
    "google-maps",
    "driving",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=1.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
cosmo-travel-mcp = "cosmo_travel_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/maththedev42/cosmo-travel-mcp"
Repository = "https://github.com/maththedev42/cosmo-travel-mcp"
Issues = "https://github.com/maththedev42/cosmo-travel-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
